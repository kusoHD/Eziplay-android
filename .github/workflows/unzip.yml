name: Auto unzip

on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip files and remove them
        run: |
          shopt -s nullglob
          for z in *.zip; do
            unzip -o "$z"
            rm -f "$z"
          done

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-unzip [skip ci]"
          git push
