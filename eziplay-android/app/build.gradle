plugins { id 'com.android.application' }

android {
    namespace 'uz.eziplay.app'
    compileSdk 34

    defaultConfig {
        applicationId "uz.eziplay.app"
        minSdk 24
        targetSdk 34
        versionCode 10227
        versionName "1.2.27"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
