plugins { id 'com.android.application' }

android {
    namespace 'uz.eziplay.app'
    compileSdk 34

    defaultConfig {
        applicationId "uz.eziplay.app"
        minSdk 24
        targetSdk 34
        versionCode 10228
        versionName "1.2.28"

        // Yangilanishlar shu GitHub repodan olinadi (repo PUBLIC bo'lishi kerak).
        // Format: "foydalanuvchi/repo-nomi"  — masalan "ali/eziplay-android"
        buildConfigField "String", "GITHUB_REPO", "\"OWNER/eziplay-android\""
        // Firebase > Authentication > Google provayderidagi "Web client ID" (xxx.apps.googleusercontent.com)
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"WEB_CLIENT_ID.apps.googleusercontent.com\""
    }

    buildFeatures {
        buildConfig true
    }

    // Imzo kaliti GitHub Secrets dan keladi (KEYSTORE_PATH bo'lsa release kalit, bo'lmasa debug)
    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_PATH")) {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Eski kotlin-stdlib-jdk7/jdk8 (1.6.x) klasslari yangi kotlin-stdlib bilan to'qnashmasin
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
}
